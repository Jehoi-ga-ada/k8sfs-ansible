---
kube_minor: "{{ kube_version.split('.')[:2] | join('.') }}"
kube_apt_repo: "https://pkgs.k8s.io/core:/stable:/{{ kube_minor }}/deb/"

cri_prereq_packages:
  - apt-transport-https
  - ca-certificates
  - curl

cri_packages:
  - kubernetes-cni
  - kubectl

cri_distro_packages:
  - containerd
  - runc

containerd_version: "2.3.3"
runc_version: "v1.5.1"
containerd_install_dir: /usr/local
containerd_url: "https://github.com/containerd/containerd/releases/download/v{{ containerd_version }}/containerd-{{ containerd_version }}-linux-{{ kube_arch }}.tar.gz"
runc_url: "https://github.com/opencontainers/runc/releases/download/{{ runc_version }}/runc.{{ kube_arch }}"

cri_kernel_modules:
  - overlay
  - br_netfilter

cri_sysctl_file: /etc/sysctl.d/k8s.conf
cri_sysctl:
  net.bridge.bridge-nf-call-iptables: '1'
  net.bridge.bridge-nf-call-ip6tables: '1'
  net.ipv4.ip_forward: '1'

containerd_config: /etc/containerd/config.toml
