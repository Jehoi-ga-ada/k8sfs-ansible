---
- name: Install the container runtime
  become: true
  when: inventory_hostname in kubelet_node_hosts
  block:
    - name: Install apt prerequisites
      ansible.builtin.apt:
        name: "{{ cri_prereq_packages }}"
        state: present
        update_cache: true

    - name: Load required kernel modules
      community.general.modprobe:
        name: "{{ item }}"
        state: present
        persistent: present
      loop: "{{ cri_kernel_modules }}"

    - name: Set required kernel parameters
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_file: "{{ cri_sysctl_file }}"
        sysctl_set: true
        reload: true
      loop: "{{ cri_sysctl | dict2items }}"

    - name: Add the Kubernetes apt repository
      ansible.builtin.deb822_repository:
        name: kubernetes
        types: deb
        uris: "{{ kube_apt_repo }}"
        suites: /
        signed_by: "{{ kube_apt_repo }}Release.key"

    - name: Install CNI components
      ansible.builtin.apt:
        name: "{{ cri_packages }}"
        state: present
        update_cache: true

    - name: Remove the distro containerd and runc
      ansible.builtin.apt:
        name: "{{ cri_distro_packages }}"
        state: absent
        purge: true

    - name: Install upstream containerd
      ansible.builtin.unarchive:
        src: "{{ containerd_url }}"
        dest: "{{ containerd_install_dir }}"
        remote_src: true
        creates: "{{ containerd_install_dir }}/bin/containerd"
      register: containerd_installed
      notify: Restart containerd

    - name: Install upstream runc
      ansible.builtin.get_url:
        url: "{{ runc_url }}"
        dest: "{{ containerd_install_dir }}/sbin/runc"
        mode: '0755'
        force: true
      notify: Restart containerd

    - name: Write the containerd systemd unit
      ansible.builtin.template:
        src: containerd.service.j2
        dest: /etc/systemd/system/containerd.service
        mode: '0644'
      notify: Restart containerd

    - name: Ensure containerd config dir exists
      ansible.builtin.file:
        path: "{{ containerd_config | dirname }}"
        state: directory
        mode: '0755'

    - name: Check for an existing containerd config
      ansible.builtin.stat:
        path: "{{ containerd_config }}"
      register: containerd_config_stat

    - name: Generate default containerd config
      ansible.builtin.shell:
        cmd: "{{ containerd_install_dir }}/bin/containerd config default > {{ containerd_config }}"
      when: containerd_installed is changed or not containerd_config_stat.stat.exists
      changed_when: true
      notify: Restart containerd

    - name: Configure containerd to use systemd cgroups
      ansible.builtin.replace:
        path: "{{ containerd_config }}"
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'
      notify: Restart containerd

    - name: Enable and start containerd
      ansible.builtin.systemd_service:
        name: containerd
        state: started
        enabled: true
        daemon_reload: true
