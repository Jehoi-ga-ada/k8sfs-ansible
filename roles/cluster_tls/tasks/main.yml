---
- name: Setup TLS
  become: true
  when: inventory_hostname == master_node
  block:
    - name: Ensure csr dir exist
      ansible.builtin.file:
        path: /etc/ssl/csr
        state: directory
        mode: '0755'

    - name: Ensure certs dir exist
      ansible.builtin.file:
        path: /etc/ssl/certs
        state: directory
        mode: '0755'

    - name: Create private key for CA
      community.crypto.openssl_privatekey:
        path: /etc/ssl/private/ca.key
        size: 2048

    - name: Create CSR for CA
      community.crypto.openssl_csr:
        path: /etc/ssl/csr/ca.csr
        privatekey_path: /etc/ssl/private/ca.key
        common_name: KUBERNETES-CA
        basic_constraints:
          - "CA:TRUE"
        basic_constraints_critical: true
        key_usage:
          - keyCertSign
          - cRLSign
          - digitalSignature
        key_usage_critical: true

    - name: Sign CSR as a self-signed certificate
      community.crypto.x509_certificate:
        path: /etc/ssl/certs/ca.crt
        csr_path: /etc/ssl/csr/ca.csr
        privatekey_path: /etc/ssl/private/ca.key
        provider: selfsigned
        selfsigned_not_after: "+3650d"
      notify: Restart etcd

    - name: Create private key for admin user
      community.crypto.openssl_privatekey:
        path: /etc/ssl/private/admin.key
        size: 2048

    - name: Create CSR for admin user
      community.crypto.openssl_csr:
        path: /etc/ssl/csr/admin.csr
        privatekey_path: /etc/ssl/private/admin.key
        common_name: admin
        organization_name: system:masters

    - name: Sign CSR for admin using CA server private key
      community.crypto.x509_certificate:
        path: /etc/ssl/certs/admin.crt
        csr_path: /etc/ssl/csr/admin.csr
        ownca_path: /etc/ssl/certs/ca.crt
        ownca_privatekey_path: /etc/ssl/private/ca.key
        provider: ownca

    - name: Create private key for controller manager
      community.crypto.openssl_privatekey:
        path: /etc/ssl/private/kube-controller-manager.key
        size: 2048

    - name: Create CSR for controller manager
      community.crypto.openssl_csr:
        path: /etc/ssl/csr/kube-controller-manager.csr
        privatekey_path: /etc/ssl/private/kube-controller-manager.key
        common_name: system:kube-controller-manager
        organization_name: system:kube-controller-manager

    - name: Sign CSR for controller manager using CA server private key
      community.crypto.x509_certificate:
        path: /etc/ssl/certs/kube-controller-manager.crt
        csr_path: /etc/ssl/csr/kube-controller-manager.csr
        ownca_path: /etc/ssl/certs/ca.crt
        ownca_privatekey_path: /etc/ssl/private/ca.key
        provider: ownca

    - name: Create private key for kube scheduler
      community.crypto.openssl_privatekey:
        path: /etc/ssl/private/kube-scheduler.key
        size: 2048

    - name: Create CSR for kube scheduler
      community.crypto.openssl_csr:
        path: /etc/ssl/csr/kube-scheduler.csr
        privatekey_path: /etc/ssl/private/kube-scheduler.key
        common_name: system:kube-scheduler
        organization_name: system:kube-scheduler

    - name: Sign CSR for kube scheduler using CA server private key
      community.crypto.x509_certificate:
        path: /etc/ssl/certs/kube-scheduler.crt
        csr_path: /etc/ssl/csr/kube-scheduler.csr
        ownca_path: /etc/ssl/certs/ca.crt
        ownca_privatekey_path: /etc/ssl/private/ca.key
        provider: ownca
      
    - name: Create private key for kube apiserver
      community.crypto.openssl_privatekey:
        path: /etc/ssl/private/kube-apiserver.key
        size: 2048

    - name: Create CSR for kube apiserver
      community.crypto.openssl_csr:
        path: /etc/ssl/csr/kube-apiserver.csr
        privatekey_path: /etc/ssl/private/kube-apiserver.key
        common_name: kube-apiserver
        organization_name: Kubernetes
        basic_constraints:
          - "CA:FALSE"
        basic_constraints_critical: true
        key_usage:
          - nonRepudiation 
          - digitalSignature
          - keyEncipherment
        key_usage_critical: true
        extended_key_usage:
          - serverAuth
        subject_alt_name:
          - "DNS:kubernetes"
          - "DNS:kubernetes.default"
          - "DNS:kubernetes.default.svc"
          - "DNS:kubernetes.default.svc.cluster"
          - "DNS:kubernetes.default.svc.cluster.local"
          - "IP:10.96.0.1"
          - "IP:{{ hostvars['master-1'].ansible_host }}"
          - "IP:{{ hostvars['master-2'].ansible_host }}"
          - "IP:{{ hostvars['lb-1'].ansible_host }}"
          - "IP:127.0.0.1"

    - name: Sign CSR for kube apiserver using CA server private key
      community.crypto.x509_certificate:
        path: /etc/ssl/certs/kube-apiserver.crt
        csr_path: /etc/ssl/csr/kube-apiserver.csr
        ownca_path: /etc/ssl/certs/ca.crt
        ownca_privatekey_path: /etc/ssl/private/ca.key
        provider: ownca

    - name: Create private key for apiserver-kubelet-client
      community.crypto.openssl_privatekey:
        path: /etc/ssl/private/apiserver-kubelet-client.key
        size: 2048

    - name: Create CSR for apiserver-kubelet-client
      community.crypto.openssl_csr:
        path: /etc/ssl/csr/apiserver-kubelet-client.csr
        privatekey_path: /etc/ssl/private/apiserver-kubelet-client.key
        common_name: kube-apiserver-kubelet-client
        organization_name: system:masters
        basic_constraints:
          - "CA:FALSE"
        basic_constraints_critical: true
        key_usage:
          - nonRepudiation 
          - digitalSignature
          - keyEncipherment
        key_usage_critical: true
        extended_key_usage:
          - clientAuth

    - name: Sign CSR for apiserver-kubelet-client using CA server private key
      community.crypto.x509_certificate:
        path: /etc/ssl/certs/apiserver-kubelet-client.crt
        csr_path: /etc/ssl/csr/apiserver-kubelet-client.csr
        ownca_path: /etc/ssl/certs/ca.crt
        ownca_privatekey_path: /etc/ssl/private/ca.key
        provider: ownca

    - name: Create private key for etcd-server
      community.crypto.openssl_privatekey:
        path: /etc/ssl/private/etcd-server.key
        size: 2048

    - name: Create CSR for etcd-server
      community.crypto.openssl_csr:
        path: /etc/ssl/csr/etcd-server.csr
        privatekey_path: /etc/ssl/private/etcd-server.key
        common_name: etcd-server
        organization_name: Kubernetes
        basic_constraints:
          - "CA:FALSE"
        basic_constraints_critical: true
        key_usage:
          - nonRepudiation 
          - digitalSignature
          - keyEncipherment
        key_usage_critical: true
        subject_alt_name:
          - "IP:{{ hostvars['master-1'].ansible_host }}"
          - "IP:{{ hostvars['master-2'].ansible_host }}"
          - "IP:127.0.0.1"

    - name: Sign CSR for etcd-server using CA server private key
      community.crypto.x509_certificate:
        path: /etc/ssl/certs/etcd-server.crt
        csr_path: /etc/ssl/csr/etcd-server.csr
        ownca_path: /etc/ssl/certs/ca.crt
        ownca_privatekey_path: /etc/ssl/private/ca.key
        provider: ownca
      notify: Restart etcd


    - name: Create private key for service account
      community.crypto.openssl_privatekey:
        path: /etc/ssl/private/service-account.key
        size: 2048

    - name: Create CSR for service account
      community.crypto.openssl_csr:
        path: /etc/ssl/csr/service-account.csr
        privatekey_path: /etc/ssl/private/service-account.key
        common_name: service-account
        organization_name: Kubernetes

    - name: Sign CSR for service account using CA server private key
      community.crypto.x509_certificate:
        path: /etc/ssl/certs/service-account.crt
        csr_path: /etc/ssl/csr/service-account.csr
        ownca_path: /etc/ssl/certs/ca.crt
        ownca_privatekey_path: /etc/ssl/private/ca.key
        provider: ownca

- name: Pull generated certs/keys to the controller
  become: true
  ansible.builtin.fetch:
    src: "{{ item }}"
    dest: "/tmp/k8s-certs{{ item }}"
    flat: true
  loop: "{{ control_plane_certs + (node_certs | difference(control_plane_certs)) }}"
  when: inventory_hostname == master_node

- name: Ensure SSL dirs exist on receivers
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/ssl/certs
    - /etc/ssl/private
  when: inventory_hostname != master_node

- name: Distribute control-plane certs to secondary masters
  become: true
  ansible.builtin.copy:
    src: "/tmp/k8s-certs{{ item }}"
    dest: "{{ item }}"
    mode: "{{ '0600' if item.endswith('.key') else '0644' }}"
  loop: "{{ control_plane_certs }}"
  notify: Restart etcd
  when:
    - inventory_hostname in groups['master']
    - inventory_hostname != master_node

- name: Distribute node certs to workers
  become: true
  ansible.builtin.copy:
    src: "/tmp/k8s-certs{{ item }}"
    dest: "{{ item }}"
    mode: "{{ '0600' if item.endswith('.key') else '0644' }}"
  loop: "{{ node_certs }}"
  when: inventory_hostname in groups['worker']
