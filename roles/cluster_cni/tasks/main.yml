---
- name: Deploy the pod network
  become: true
  run_once: true
  delegate_to: "{{ master_node }}"
  environment:
    KUBECONFIG: "{{ admin_kubeconfig }}"
  block:
    - name: Download and extract helm
      ansible.builtin.unarchive:
        src: "{{ helm_url }}"
        dest: /tmp
        remote_src: true
        creates: "{{ helm_release_dir }}/helm"

    - name: Install helm
      ansible.builtin.copy:
        src: "{{ helm_release_dir }}/helm"
        dest: "{{ helm_bin }}"
        remote_src: true
        mode: '0755'

    - name: Write the Cilium values
      ansible.builtin.copy:
        content: "{{ cilium_values | to_nice_yaml }}"
        dest: "{{ cilium_values_file }}"
        mode: '0600'

    - name: Install Cilium
      ansible.builtin.command:
        cmd: >-
          {{ helm_bin }} upgrade --install {{ cilium_release }} {{ cilium_chart }}
          --repo {{ cilium_repo }}
          --version {{ cilium_version }}
          --namespace {{ cilium_namespace }}
          --values {{ cilium_values_file }}
      changed_when: true

    - name: Wait for the Cilium agents
      ansible.builtin.command:
        cmd: >-
          kubectl rollout status daemonset/{{ cilium_daemonset }}
          --namespace {{ cilium_namespace }}
          --timeout={{ cilium_rollout_timeout }}
      changed_when: false
