---
- name: Deploy the pod network
  become: true
  run_once: true
  delegate_to: "{{ master_node }}"
  environment:
    KUBECONFIG: "{{ admin_kubeconfig }}"
  block:
    - name: Download and extract helm
      ansible.builtin.unarchive:
        src: "{{ helm_url }}"
        dest: /tmp
        remote_src: true
        creates: "{{ helm_release_dir }}/helm"

    - name: Install helm
      ansible.builtin.copy:
        src: "{{ helm_release_dir }}/helm"
        dest: "{{ helm_bin }}"
        remote_src: true
        mode: '0755'

    - name: Install the Gateway API CRDs
      ansible.builtin.command:
        cmd: "kubectl apply -f {{ gateway_api_crd_url }}"
      register: gateway_api_crd_apply
      changed_when: "'unchanged' not in gateway_api_crd_apply.stdout"

    - name: Wait for the Gateway API CRDs to be established
      ansible.builtin.command:
        cmd: >-
          kubectl wait --for=condition=established
          --timeout={{ cilium_rollout_timeout }}
          crd/{{ item }}
      loop: "{{ gateway_api_crds }}"
      changed_when: false

    - name: Write the Cilium values
      ansible.builtin.copy:
        content: "{{ cilium_values | to_nice_yaml }}"
        dest: "{{ cilium_values_file }}"
        mode: '0600'
      register: cilium_values_written

    - name: Install Cilium
      ansible.builtin.command:
        cmd: >-
          {{ helm_bin }} upgrade --install {{ cilium_release }} {{ cilium_chart }}
          --repo {{ cilium_repo }}
          --version {{ cilium_version }}
          --namespace {{ cilium_namespace }}
          --values {{ cilium_values_file }}
      changed_when: true

    - name: Restart Cilium when the values changed
      ansible.builtin.command:
        cmd: >-
          kubectl rollout restart
          daemonset/{{ cilium_daemonset }}
          deployment/{{ cilium_operator_deployment }}
          --namespace {{ cilium_namespace }}
      when: cilium_values_written is changed
      changed_when: true

    - name: Wait for the Cilium operator
      ansible.builtin.command:
        cmd: >-
          kubectl rollout status deployment/{{ cilium_operator_deployment }}
          --namespace {{ cilium_namespace }}
          --timeout={{ cilium_rollout_timeout }}
      changed_when: false

    - name: Wait for the load balancer CRDs to be established
      ansible.builtin.command:
        cmd: >-
          kubectl wait --for=condition=established
          --timeout={{ cilium_rollout_timeout }}
          crd/{{ item }}
      loop: "{{ cilium_lb_crds }}"
      changed_when: false

    - name: Wait for the Cilium agents
      ansible.builtin.command:
        cmd: >-
          kubectl rollout status daemonset/{{ cilium_daemonset }}
          --namespace {{ cilium_namespace }}
          --timeout={{ cilium_rollout_timeout }}
      changed_when: false

    - name: Ensure the addon manifest dir exists
      ansible.builtin.file:
        path: "{{ cilium_addon_dir }}"
        state: directory
        mode: '0700'

    - name: Render the Cilium load balancer manifest
      ansible.builtin.template:
        src: cilium-lb.yaml.j2
        dest: "{{ cilium_lb_manifest }}"
        mode: '0600'

    - name: Apply the Cilium load balancer manifest
      ansible.builtin.command:
        cmd: "kubectl apply -f {{ cilium_lb_manifest }}"
      register: cilium_lb_apply
      changed_when: "'unchanged' not in cilium_lb_apply.stdout"

    - name: Restart the Cilium agents so they pick up the L2 policy
      ansible.builtin.command:
        cmd: >-
          kubectl rollout restart daemonset/{{ cilium_daemonset }}
          --namespace {{ cilium_namespace }}
      when: cilium_lb_apply is changed
      changed_when: true

    - name: Wait for the Cilium agents after the L2 policy change
      ansible.builtin.command:
        cmd: >-
          kubectl rollout status daemonset/{{ cilium_daemonset }}
          --namespace {{ cilium_namespace }}
          --timeout={{ cilium_rollout_timeout }}
      when: cilium_lb_apply is changed
      changed_when: false

    - name: Render the Gateway manifest
      ansible.builtin.template:
        src: gateway.yaml.j2
        dest: "{{ gateway_manifest }}"
        mode: '0600'

    - name: Apply the Gateway manifest
      ansible.builtin.command:
        cmd: "kubectl apply -f {{ gateway_manifest }}"
      register: gateway_apply
      changed_when: "'unchanged' not in gateway_apply.stdout"

    - name: Wait for the Gateway to be programmed
      ansible.builtin.command:
        cmd: >-
          kubectl wait --for=condition=Programmed
          --timeout={{ cilium_rollout_timeout }}
          gateway/{{ gateway_name }}
          --namespace {{ gateway_namespace }}
      changed_when: false

    - name: Read the Gateway address
      ansible.builtin.command:
        cmd: >-
          kubectl get gateway {{ gateway_name }}
          --namespace {{ gateway_namespace }}
          --output jsonpath={.status.addresses[0].value}
      register: gateway_address
      changed_when: false

- name: Gateway address
  ansible.builtin.debug:
    msg: "HTTPRoutes attach to {{ gateway_name }}.{{ gateway_namespace }} at {{ gateway_address.stdout }}"
  run_once: true
