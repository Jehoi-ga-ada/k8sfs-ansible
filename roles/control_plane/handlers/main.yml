---
- name: Restart kube-apiserver
  ansible.builtin.systemd_service:
    name: kube-apiserver
    state: restarted
    daemon_reload: true
  become: true

- name: Restart kube-controller-manager
  ansible.builtin.systemd_service:
    name: kube-controller-manager
    state: restarted
    daemon_reload: true
  become: true

- name: Restart kube-scheduler
  ansible.builtin.systemd_service:
    name: kube-scheduler
    state: restarted
    daemon_reload: true
  become: true

- name: Restart haproxy
  ansible.builtin.systemd_service:
    name: haproxy
    state: restarted
  become: true
