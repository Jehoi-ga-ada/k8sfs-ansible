---
- name: Prerequisite for VM terraforming
  hosts: macos
  environment:
    PATH: "/opt/homebrew/bin:{{ ansible_env.PATH }}" 
  roles:
    - geerlingguy.mac.homebrew
  tasks:
    - name: Add brew to PATH for shells
      ansible.builtin.lineinfile:
        path: "{{ ansible_user_dir }}/.zshenv"
        line: 'eval "$(/opt/homebrew/bin/brew shellenv)"'
        create: true

    - name: Tap into cirruslabs repo
      community.general.homebrew_tap:
        name: cirruslabs/cli
        state: present

    - name: Trust cirruslabs formula
      ansible.builtin.command: brew trust cirruslabs/cli

    - name: Install tart & orchard
      community.general.homebrew:
        name: [cirruslabs/cli/tart, cirruslabs/cli/orchard]
        state: present
