---
- name: Run the orchard controller
  hosts: orchard_controller
  roles:
    - role: orchard_controller

- name: Run the orchard workers
  hosts: orchard_workers
  roles:
    - role: orchard_worker
  tasks:
    - name: Confirm worker joined
      ansible.builtin.command: orchard list workers
      environment: "{{ orchard_admin_env }}"
      delegate_to: "{{ orchard_controller_host }}"
      register: workers
      changed_when: false

    - name: Print worker list + terraform connection info
      ansible.builtin.debug:
        msg:
          - "workers:\n{{ workers.stdout }}"
          - "terraform → url=http://{{ hostvars[orchard_controller_host].ansible_host }}:{{ orchard_port }}  name=terraform  token={{ orchard_terraform_token }}"
