---
- name: Prerequisite for VM terraforming
  hosts: macos
  roles:
    - geerlingguy.mac.homebrew
  tasks:
    - name: Install qemu & libvirt
      community.general.homebrew:
        name: [qemu, libvirt]
        state: present

    - name: Start libvirt as a root service
      ansible.builtin.shell: sudo brew services start libvirt
      environment: { PATH: "/opt/homebrew/bin:{{ ansible_env.PATH }}" }

    - name: Add brew to PATH for shells
      ansible.builtin.lineinfile:
        path: ~/.zshenv
        line: 'eval "$(/opt/homebrew/bin/brew shellenv)"'
        create: true

    - name: Open libvirt RW socket to the staff group
      ansible.builtin.lineinfile:
        path: /opt/homebrew/etc/libvirt/libvirtd.conf
        regexp: '^#?\s*{{ item.k }}\s*='
        line: '{{ item.k }} = "{{ item.v }}"'
      loop:
        - { k: "unix_sock_group",    v: "staff" }
        - { k: "unix_sock_rw_perms", v: "0770" }
        - { k: "auth_unix_rw",       v: "none" }
      become: true
      notify: restart libvirtd

  handlers:
    - name: restart libvirtd
      ansible.builtin.command: killall libvirtd 
      become: true
