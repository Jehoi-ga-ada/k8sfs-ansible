---
- name: Prerequisite for VM terraforming
  hosts: macos
  roles:
    - geerlingguy.mac.hombrew
  tasks:
    - name: Install qemu & libvirt
      community.general.homebrew:
        name: [qemu, libvirt]
        state: present

    - name: Start libvirt service
      community.general.homebrew_services:
        name: libvirt
        state: present

    - name: Add brew to PATH for shells
      ansible.builtin.lineinfile:
        path: ~/.zshenv
        line: 'eval "$(/opt/homebrew/bin/brew shellenv)"'
        create: true
